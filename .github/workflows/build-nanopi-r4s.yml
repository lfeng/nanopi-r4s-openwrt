name: Build NanoPi R4S

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-24.10

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rockchip/armv8 NanoPi R4S images
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TARGET_DIR: bin/targets/rockchip/armv8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3-dev \
            python3 \
            python3-distutils \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            subversion \
            swig \
            time \
            unzip \
            xsltproc \
            zlib1g-dev \
            cpio \
            file \
            wget

      - name: Update and install feeds
        run: |
          set -euo pipefail

          run_with_retry() {
            local description="$1"
            shift

            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi

              if [ "${attempt}" -eq 3 ]; then
                echo "${description} failed after ${attempt} attempts" >&2
                return 1
              fi

              echo "${description} failed; retrying in $((attempt * 20)) seconds" >&2
              sleep $((attempt * 20))
            done
          }

          run_with_retry "feeds update" ./scripts/feeds update -a

          geoview_makefile="feeds/passwall_packages/geoview/Makefile"
          perl -0pi -e \
            's/^PKG_VERSION:=.*/PKG_VERSION:=0.1.10/m; s/^PKG_HASH:=.*/PKG_HASH:=9221df928df68030893125a60bdf6d8a1fef2b199fa58ed80772cb3c17225fc5/m' \
            "${geoview_makefile}"
          grep -q '^PKG_VERSION:=0.1.10$' "${geoview_makefile}"
          grep -q '^PKG_HASH:=9221df928df68030893125a60bdf6d8a1fef2b199fa58ed80772cb3c17225fc5$' "${geoview_makefile}"

          xray_makefile="feeds/passwall_packages/xray-core/Makefile"
          perl -0pi -e \
            's/^PKG_VERSION:=.*/PKG_VERSION:=25.2.21/m; s/^PKG_HASH:=.*/PKG_HASH:=a565db518d2da12fabb74e123d9bf2bdbc34420b81373938f8fcbc7004fda3ba/m' \
            "${xray_makefile}"
          grep -q '^PKG_VERSION:=25.2.21$' "${xray_makefile}"
          grep -q '^PKG_HASH:=a565db518d2da12fabb74e123d9bf2bdbc34420b81373938f8fcbc7004fda3ba$' "${xray_makefile}"

          run_with_retry "feeds install" ./scripts/feeds install -a

      - name: Add custom packages
        run: |
          mkdir -p package/custom
          git clone --depth 1 --branch master https://github.com/mchome/openwrt-vlmcsd.git package/custom/vlmcsd
          git clone --depth 1 --branch master https://github.com/mchome/luci-app-vlmcsd.git package/custom/luci-app-vlmcsd

      - name: Configure NanoPi R4S build
        run: |
          cp configs/nanopi-r4s.config .config
          make defconfig

          require_config() {
            local symbol="$1"
            if ! grep -q "^${symbol}=y$" .config; then
              echo "Missing expected config: ${symbol}" >&2
              grep -E 'CONFIG_(TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s|PACKAGE_luci|PACKAGE_luci-ssl|LUCI_LANG_zh_Hans|PACKAGE_dnsmasq|PACKAGE_dnsmasq-full|PACKAGE_luci-app-passwall2|PACKAGE_luci-i18n-passwall2|PACKAGE_vlmcsd|PACKAGE_luci-app-vlmcsd|PACKAGE_xray-core|PACKAGE_geoview|PACKAGE_v2ray|PACKAGE_sing-box|PACKAGE_shadowsocks|PACKAGE_haproxy|PACKAGE_blkid|PACKAGE_losetup|PACKAGE_parted|PACKAGE_resize2fs)' .config || true
              exit 1
            fi
          }

          forbid_config() {
            local symbol="$1"
            if grep -q "^${symbol}=y$" .config; then
              echo "Unexpected config enabled: ${symbol}" >&2
              grep -E 'CONFIG_(TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s|PACKAGE_luci|PACKAGE_luci-ssl|LUCI_LANG_zh_Hans|PACKAGE_dnsmasq|PACKAGE_dnsmasq-full|PACKAGE_luci-app-passwall2|PACKAGE_luci-i18n-passwall2|PACKAGE_vlmcsd|PACKAGE_luci-app-vlmcsd|PACKAGE_xray-core|PACKAGE_geoview|PACKAGE_sing-box|PACKAGE_v2ray-plugin|PACKAGE_hysteria|PACKAGE_tuic-client|PACKAGE_shadowsocks-rust)' .config || true
              exit 1
            fi
          }

          require_config CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s
          require_config CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s-enterprise
          require_config CONFIG_PACKAGE_luci
          require_config CONFIG_PACKAGE_luci-ssl
          require_config CONFIG_LUCI_LANG_zh_Hans
          require_config CONFIG_PACKAGE_dnsmasq-full
          require_config CONFIG_PACKAGE_luci-app-passwall2
          require_config CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn
          require_config CONFIG_PACKAGE_vlmcsd
          require_config CONFIG_PACKAGE_luci-app-vlmcsd
          require_config CONFIG_PACKAGE_xray-core
          require_config CONFIG_PACKAGE_geoview
          require_config CONFIG_PACKAGE_blkid
          require_config CONFIG_PACKAGE_losetup
          require_config CONFIG_PACKAGE_parted
          require_config CONFIG_PACKAGE_resize2fs
          forbid_config CONFIG_PACKAGE_dnsmasq
          forbid_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Hysteria
          forbid_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_NaiveProxy
          forbid_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client
          forbid_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server
          forbid_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox
          forbid_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_tuic_client
          forbid_config CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build third-party package smoke checks
        run: |
          make tools/install -j"$(nproc)" V=s
          make toolchain/install -j"$(nproc)" V=s
          make package/feeds/passwall_packages/xray-core/compile -j"$(nproc)" V=s
          make package/feeds/passwall_packages/geoview/compile -j"$(nproc)" V=s
          make package/custom/vlmcsd/compile -j"$(nproc)" V=s
          make package/custom/luci-app-vlmcsd/compile -j"$(nproc)" V=s

      - name: Build firmware
        run: make -j"$(nproc)" V=s

      - name: Verify image set
        run: |
          set -euo pipefail

          expected=(
            "friendlyarm_nanopi-r4s-ext4-sysupgrade.img.gz"
            "friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz"
            "friendlyarm_nanopi-r4s-enterprise-ext4-sysupgrade.img.gz"
            "friendlyarm_nanopi-r4s-enterprise-squashfs-sysupgrade.img.gz"
          )

          for suffix in "${expected[@]}"; do
            matches=("${TARGET_DIR}"/*"${suffix}")
            if [ ! -e "${matches[0]}" ]; then
              echo "Missing expected image: ${suffix}" >&2
              exit 1
            fi
          done

          mapfile -t unexpected < <(
            find "${TARGET_DIR}" -maxdepth 1 -type f -name '*sysupgrade.img.gz' \
              ! -name '*friendlyarm_nanopi-r4s-*' \
              -printf '%f\n' | sort
          )

          if [ "${#unexpected[@]}" -ne 0 ]; then
            printf 'Unexpected sysupgrade images:\n' >&2
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cp "${TARGET_DIR}"/*friendlyarm_nanopi-r4s*.img.gz artifacts/
          cp .config artifacts/nanopi-r4s.config.resolved

          for artifact in \
            sha256sums \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo \
            profiles.json \
            *.manifest; do
            for path in "${TARGET_DIR}"/${artifact}; do
              [ -e "${path}" ] || continue
              cp "${path}" artifacts/
            done
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r4s-openwrt-24.10
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
