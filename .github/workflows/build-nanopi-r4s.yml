name: Build NanoPi R4S

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-24.10

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rockchip/armv8 NanoPi R4S images
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TARGET_DIR: bin/targets/rockchip/armv8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3-dev \
            python3 \
            python3-distutils \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            subversion \
            swig \
            time \
            unzip \
            xsltproc \
            zlib1g-dev \
            cpio \
            file \
            wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure NanoPi R4S build
        run: |
          cp configs/nanopi-r4s.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s-enterprise=y$' .config
          grep -q '^CONFIG_PACKAGE_luci=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-ssl=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y$' .config

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)" V=s

      - name: Verify image set
        run: |
          set -euo pipefail

          expected=(
            "friendlyarm_nanopi-r4s-ext4-sysupgrade.img.gz"
            "friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz"
            "friendlyarm_nanopi-r4s-enterprise-ext4-sysupgrade.img.gz"
            "friendlyarm_nanopi-r4s-enterprise-squashfs-sysupgrade.img.gz"
          )

          for suffix in "${expected[@]}"; do
            matches=("${TARGET_DIR}"/*"${suffix}")
            if [ ! -e "${matches[0]}" ]; then
              echo "Missing expected image: ${suffix}" >&2
              exit 1
            fi
          done

          mapfile -t unexpected < <(
            find "${TARGET_DIR}" -maxdepth 1 -type f -name '*sysupgrade.img.gz' \
              ! -name '*friendlyarm_nanopi-r4s-*' \
              -printf '%f\n' | sort
          )

          if [ "${#unexpected[@]}" -ne 0 ]; then
            printf 'Unexpected sysupgrade images:\n' >&2
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cp "${TARGET_DIR}"/*friendlyarm_nanopi-r4s*.img.gz artifacts/
          cp .config artifacts/nanopi-r4s.config.resolved

          for artifact in \
            sha256sums \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo \
            profiles.json \
            *.manifest; do
            for path in "${TARGET_DIR}"/${artifact}; do
              [ -e "${path}" ] || continue
              cp "${path}" artifacts/
            done
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r4s-openwrt-24.10
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
